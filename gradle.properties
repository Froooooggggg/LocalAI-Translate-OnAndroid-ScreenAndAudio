# AGP 9 需要 JDK 17 或更高；默认用 JAVA_HOME/PATH 上的 java。
# 机器上有多套 JDK 时，取消最后一行注释并改成绝对路径。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# org.gradle.java.home=C:\Program Files\Java\jdk-17
android.useAndroidX=true
android.nonTransitiveRClass=true

# === Kotlin 增量编译：本机 Windows 上必须关闭 ===
# 症状：Could not close incremental caches ... class-fq-name-to-source.tab 等
# 原因：Kotlin 守护进程以内存映射方式持有这些 .tab 缓存，退出时无法关闭
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# 项目路径含中文时启用（本项目路径纯 ASCII，保留无害）
android.overridePathCheck=true

# === 代理开关（默认关闭）===
# 依赖走阿里云镜像、Gradle 发行版走腾讯云镜像，正常构建无需代理。
# 仅在构建卡在「连接已建立但零响应」时取消注释。
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=5188
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=5188
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.local
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.local
